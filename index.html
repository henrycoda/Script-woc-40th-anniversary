<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Script 40th CoDA Anniversary 24 Hour Event</title><style>

background:#fff4dc;border-left:5px solid #c9982f;font-weight:600}.prayer{background:#f2f7f3;border-left:4px solid #74a589;text-align:center;line-height:1.9;padding:18px}.resource{padding:5px 12px;margin:2px 0;border-left:3px solid #b9cbd9}.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:24px}@media(max-width:620px){section{padding:17px 14px}.toolbar{padding:10px}.push{margin-left:0}.item{padding:10px}.top{padding:24px 18px}}@media print{.toolbar,nav,.note,.foot{display:none}.top{background:white;color:black;padding:0 0 18px}.top p{color:#555}.wrap{margin:0;padding:0}section{border:0;box-shadow:none;break-inside:auto;padding:8px 0;margin:0 0 16px}h2{break-after:avoid}.item{break-inside:avoid;font-size:13pt}.action,.spoken,.reader-instruction,.important,.prayer{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body><header class="top"><h1 id="title">40th CoDA Birthday 24-hour Event Script</h1><p id="subtitle"></p></header><div class="toolbar"><div class="toolbar-inner"><div><label for="lang">Language / Idioma / Língua / زبان / Langue</label><select id="lang"><option value="en">English</option><option value="es">Latin American Spanish</option><option value="pt">Brazilian Portuguese</option><option value="pt-PT">Portugal Portuguese</option><option value="fa">Persian — فارسی</option><option value="fr">French</option></select></div><div><label>Text size</label><button id="smaller" aria-label="Decrease font size">A−</button> <button id="larger" aria-label="Increase font size">A+</button></div><button class="push" onclick="window.print()">Print / Save PDF</button></div></div><main class="wrap"><div class="note" id="note"></div><nav id="nav"></nav><div id="content"></div><div class="foot" id="footer"></div></main><script>
const data={"en": ["Ask screen sharer to go to slide 1 (1st Caption Slide)", "Screen share each of the different languages slides of how to get other languages slowly to allow participants to read them.", "“We will be starting the meeting in a few minutes, if you do not speak English here are some instructions in different languages on how to turn on and adjust the Zoom Translations and Closed Captions.\nAt the bottom right of your Zoom screen, click More, then Show Captions (CC)\nClick the small arrow (˄) beside Captions, enable Translation to ON, and\na) choose the language you wish to READ\nb) choose the language you wish to SPEAK\nPlease speak clearly and slowly to help those following through translated captions..”", "“If you wish to be renamed, chat with a co-host and they will change it.”", "Screen Share the WOC Flyer slide", "“Welcome to the SPECIAL THANK YOU — CELEBRATING 40 YEARS OF CoDA FROM AROUND THE WORLD MEETING!”", "Screen share the CoDA Opening Prayer", "“After a moment of silence I’ll read the CoDA Opening Prayer.”", "Give a moment of silence and then read the CoDA Opening Prayer.", "The CoDA Opening Prayer:\nIn the spirit of love and truth, we ask our Higher Power\nto guide us as we share our experience, strength, and hope.\nWe open our hearts to the light of wisdom,\nthe warmth of love, and the joy of acceptance.", "“Can we please have 4 volunteers to read the CoDA foundational documents. Please raise your hand if you would like to read. *Please read slowly to allow for translation.*”", "Screen Share The Preamble.", "See first hand raised (participants list or on screen) and say name of that participant then", "“Would you please read the CoDA Preamble?”", "Screen Share The Welcome.", "See first hand raised (participants list or on screen) and say name of that participant then", "“Would you please read the CoDA Welcome?”", "Screen Share The Twelve Steps.", "See first hand raised (participants list or on screen) and say name of that participant then", "“Would you please read the CoDA Twelve Steps?”", "Screen Share The Twelve Traditions.", "See first hand raised (participants list or on screen) and say name of that participant then", "“Would you please read the CoDA Twelve Traditions?”", "Time Slot's Group / Script Reader's Discretion:\nUse the “CoDA Guide to Sharing” slide and/or the “What Is Crosstalk” slide before proceeding to the reading of “For Safety's Sake.”", "If either readings are chosen or both, please ask for volunteers to read them.", "“Can we have a volunteer to read the CoDA Guide to Sharing?”", "“Can we have a volunteer to read the What is Crosstalk?”", "Screen Share For Safety's Sake.", "See first hand raised (participants list or on screen) and say name of that participant then", "“Would you please read the CoDA For Safety's Sake?”", "“For anonymity, please be sure you are in a safe, private place.”", "“The chat will be disabled during sharing time except to the host or co-hosts.”", "**Ken and Mary, the founders, will be speaking in the first session (AZ 5 pm/7pm EST Friday, GMT 00:00 Saturday) and then later (AZ 9 am/11am EST Saturday, GMT 4 pm Saturday).**", "“Raise your hand if you wish to share your Experience, Strength, and Hope.”", "“The sharing will be for up to ______ minutes each (host or moderator/script reader chooses time for sharing). Please wrap up when you hear the timer. [*as a gentle reminder please speak slowly to allow for translations to happen.]”", "If a volunteer is signed up to be timer in the Time Chart ask if they are available to time. If not, ask for a volunteer to be timer.", "“Can I have a volunteer to be Timer for us?”", "Screen Share the WOC Info Image.", "Mention the Sponsorship Workshop ", "“The World Outreach Committee will be having a Sponsorship Workshop on Saturday, January 30th, 2027, we will be sharing more details when we have them with the fellowship and a Flyer will be posted in the coda.org Website.”", "Screen share the 7th Tradition/Donation slide", "“Tradition 7: Every CoDA group ought to be fully self-supporting, declining outside contributions.”", "“Our 7th tradition reminds us that we are self-supporting through our own contributions and every CoDA group ought to be fully self-supporting, declining outside contributions. We ask that you donate as you can.”", "“Thank you everyone who did service and helped make this meeting possible.”", "Screen Share the Twelve Promises slide", "“Please raise your hand if you would like to read the Promises.”", "The Twelve Promises", "On the slide \"Join us in the CoDA _______ Prayer\" choose a prayer to close out the meeting or *if in another language, share the prayer on screen or say the prayer you have chosen for closing the meeting.*", "Read the chosen prayer.", "“Keep Coming Back! It works if you work it! So work it! You are worth it!”", "Thank everyone for the meeting.", "At the end of every two hours:", "Choose music to play in between slot times.", "Suggested extra readings when people are done sharing, if time.", "Codependency & Recovery: The Differences", "Co-Dependence Anonymous, Chapter Two: Our Spiritual Dilemma ", "Co-Dependence Anonymous, Chapter Five: choose a section", "In This Moment", "Choose any music to play.", "Long-time members may be given time to share 10-15 minutes."], "es": ["Pida a quien comparte pantalla que vaya a la diapositiva 1 (primera diapositiva de subtítulos).", "Comparta lentamente cada diapositiva en los diferentes idiomas sobre cómo acceder a otros idiomas, para que los participantes puedan leerlas.", "“Comenzaremos la reunión en unos minutos. Si no habla inglés, aquí encontrará instrucciones en diferentes idiomas sobre cómo activar y ajustar las traducciones y los subtítulos de Zoom.\nEn la parte inferior derecha de su pantalla de Zoom, haga clic en Más y luego en Mostrar subtítulos (CC)\nHaga clic en la flecha pequeña (˄) junto a Subtítulos, active Traducción y\na) elija el idioma en el que desea LEER\nb) elija el idioma en el que desea HABLAR\nPor favor, hablen con claridad y despacio para ayudar a quienes siguen los subtítulos traducidos.”", "“Si desea cambiar su nombre, envíe un mensaje a un coanfitrión y lo cambiará.”", "Compartir en pantalla la diapositiva del volante del WOC.", "“¡Bienvenidos a la REUNIÓN DE AGRADECIMIENTO ESPECIAL — CELEBRANDO 40 AÑOS DE CoDA DESDE TODO EL MUNDO!”", "Comparta en pantalla la oración que haya elegido para abrir la reunión.", "“Después de un momento de silencio, leeremos la oración de ________.”", "Guarde un momento de silencio y luego lea la oración de ________.", "“¿Podemos contar con 4 voluntarios para leer los documentos fundamentales de CoDA? Levante la mano si desea leer. *Por favor, lea despacio para permitir la traducción.*”", "Comparta en pantalla el Preámbulo.", "Observe quién levantó la mano primero (en la lista de participantes o en pantalla), diga su nombre y pregunte: “¿Podría leer el Preámbulo de CoDA?”", "Comparta en pantalla la Bienvenida.", "Observe quién levantó la mano primero (en la lista de participantes o en pantalla), diga su nombre y pregunte: “¿Podría leer la Bienvenida de CoDA?”", "Comparta en pantalla los Doce Pasos.", "Observe quién levantó la mano primero (en la lista de participantes o en pantalla), diga su nombre y pregunte: “¿Podría leer los Doce Pasos de CoDA?”", "Comparta en pantalla las Doce Tradiciones.", "Observe quién levantó la mano primero (en la lista de participantes o en pantalla), diga su nombre y pregunte: “¿Podría leer las Doce Tradiciones de CoDA?”", "Utilice y lea aquí cualquier lectura elegida de Codependientes Anónimos sobre las conversaciones cruzadas o la seguridad.", "“Para preservar el anonimato, asegúrese de estar en un lugar seguro y privado.”", "“El chat estará desactivado durante el tiempo de compartir, excepto para comunicarse con el anfitrión o los coanfitriones.”", "**Ken y Mary, los fundadores, hablarán en la primera sesión (AZ 5 pm/7pm EST viernes, GMT 00:00 sábado) y luego más tarde (AZ 9 am/11am EST sábado, GMT 4 pm sábado).**", "“Levante la mano si desea compartir su Experiencia, Fortaleza y Esperanza.”", "“Cada participación será de hasta ______ minutos (el anfitrión o moderador/lector del guion elige el tiempo para compartir). Por favor, termine cuando escuche el temporizador. [*como recordatorio amable, por favor hable despacio para que se puedan realizar las traducciones.]”", "Si hay una persona voluntaria inscrita como responsable del tiempo en la tabla de horarios, pregúntele si está disponible para controlar el tiempo. Si no, solicite otra persona voluntaria.", "“¿Podemos contar con una persona voluntaria para controlar el tiempo?”", "Compartir en pantalla la imagen informativa del WOC.", "Mencionar el taller de apadrinamiento", "“El Comité de Divulgación Mundial realizará un taller de apadrinamiento el sábado 30 de enero de 2027. Compartiremos más detalles con la comunidad cuando estén disponibles y se publicará un volante en el sitio web coda.org.”", "Compartir pantalla con la Séptima Tradición", "“Nuestra séptima tradición nos recuerda que nos sostenemos con nuestras propias contribuciones y que todo grupo de CoDA debe mantenerse completamente a sí mismo, negándose a recibir contribuciones de afuera. Le pedimos que done según sus posibilidades.”", "“Gracias a todas las personas que prestaron servicio y ayudaron a hacer posible esta reunión.”", "Compartir pantalla con las Doce Promesas", "“Por favor, levante la mano si desea leer...”", "Las Doce Promesas", "Elija una oración para cerrar la reunión.", "Lea la oración elegida.", "“¡Sigue viniendo! ¡Funciona si lo trabajas! ¡Así que trabájalo! ¡Tú lo vales!”", "Agradezca a todos por participar en la reunión.", "Al final de cada dos horas:", "Elija música para reproducir entre los horarios de las sesiones.", "Lecturas adicionales sugeridas cuando las personas terminen de compartir, si hay tiempo.", "Elija cualquier música para reproducir.", "Se puede dar a los miembros con muchos años en recuperación entre 10 y 15 minutos para compartir."], "pt": ["Peça à pessoa que compartilha a tela para ir ao slide 1 (primeiro slide de legendas).", "Compartilhe lentamente cada slide dos diferentes idiomas que explica como acessar outros idiomas, dando tempo para os participantes lerem.", "“Começaremos a reunião em alguns minutos. Se você não fala inglês, aqui estão instruções em diferentes idiomas sobre como ativar e ajustar as traduções e legendas do Zoom.\nNo canto inferior direito da tela do Zoom, clique em Mais e depois em Mostrar legendas (CC)\nClique na pequena seta (˄) ao lado de Legendas, ative a Tradução e\na) escolha o idioma em que deseja LER\nb) escolha o idioma em que deseja FALAR\nPor favor, falem de forma clara e devagar para ajudar quem acompanha as legendas traduzidas.”", "“Se desejar alterar seu nome, envie uma mensagem a um coanfitrião e ele fará a alteração.”", "Compartilhar na tela o slide do cartaz do WOC.", "“Bem-vindos à REUNIÃO DE AGRADECIMENTO ESPECIAL — CELEBRANDO 40 ANOS DE CoDA AO REDOR DO MUNDO!”", "Compartilhe na tela a oração escolhida para abrir a reunião.", "“Após um momento de silêncio, leremos a oração de ________.”", "Faça um momento de silêncio e depois leia a oração de ________.", "“Podemos contar com 4 voluntários para ler os documentos fundamentais de CoDA? Levante a mão se quiser ler. *Por favor, leia devagar para permitir a tradução.*”", "Compartilhe na tela o Preâmbulo.", "Veja quem levantou a mão primeiro (na lista de participantes ou na tela), diga o nome da pessoa e pergunte: “Você poderia ler o Preâmbulo de CoDA?”", "Compartilhe na tela as Boas-vindas.", "Veja quem levantou a mão primeiro (na lista de participantes ou na tela), diga o nome da pessoa e pergunte: “Você poderia ler as Boas-vindas de CoDA?”", "Compartilhe na tela os Doze Passos.", "Veja quem levantou a mão primeiro (na lista de participantes ou na tela), diga o nome da pessoa e pergunte: “Você poderia ler os Doze Passos de CoDA?”", "Compartilhe na tela as Doze Tradições.", "Veja quem levantou a mão primeiro (na lista de participantes ou na tela), diga o nome da pessoa e pergunte: “Você poderia ler as Doze Tradições de CoDA?”", "Use e leia aqui qualquer leitura escolhida de Codependentes Anônimos sobre interrupções ou segurança.", "“Para preservar o anonimato, certifique-se de estar em um local seguro e privado.”", "“O chat ficará desativado durante os compartilhamentos, exceto para o anfitrião e os coanfitriões.”", "**Ken e Mary, os fundadores, falarão na primeira sessão (AZ 5 pm/7pm EST sexta-feira, GMT 00:00 sábado) e depois mais tarde (AZ 9 am/11am EST sábado, GMT 4 pm sábado).**", "“Levante a mão se quiser compartilhar sua Experiência, Força e Esperança.”", "“Cada compartilhamento terá até ______ minutos (o anfitrião ou moderador/leitor do roteiro escolhe o tempo para compartilhar). Por favor, conclua ao ouvir o cronômetro. [*como um lembrete gentil, por favor fale devagar para permitir que as traduções aconteçam.]”", "Mencionar a oficina de apadrinhamento", "Se houver uma pessoa voluntária inscrita como responsável pelo tempo na tabela de horários, pergunte se está disponível. Caso contrário, peça uma pessoa voluntária para controlar o tempo.", "“Podemos contar com uma pessoa voluntária para controlar o tempo?”", "Compartilhar na tela a imagem informativa do WOC.", "“O Comitê de Divulgação Mundial realizará uma oficina sobre apadrinhamento no sábado, 30 de janeiro de 2027. Compartilharemos mais detalhes com a irmandade assim que estiverem disponíveis, e um cartaz será publicado no site coda.org.”", "Compartilhar a tela com a Sétima Tradição", "“Nossa sétima tradição nos lembra que nos sustentamos por meio de nossas próprias contribuições e que todo grupo de CoDA deve ser totalmente autossustentável, recusando contribuições externas. Pedimos que contribua conforme suas possibilidades.”", "“Obrigado a todas as pessoas que prestaram serviço e ajudaram a tornar esta reunião possível.”", "Compartilhar a tela com as Doze Promessas", "“Por favor, levante a mão se quiser ler...”", "As Doze Promessas", "Escolha uma oração para encerrar a reunião.", "Leia a oração escolhida.", "“Continue voltando! Funciona se você praticar! Então pratique! Você vale a pena!”", "Agradeça a todos pela reunião.", "Ao final de cada duas horas:", "Escolha uma música para tocar entre os horários das sessões.", "Leituras adicionais sugeridas quando todos terminarem de compartilhar, se houver tempo.", "Escolha qualquer música para tocar.", "Membros antigos podem receber de 10 a 15 minutos para compartilhar."], "fr": ["Demandez à la personne qui partage son écran d'aller à la diapositive 1 (première diapositive sur les sous-titres).", "Partagez lentement chaque diapositive expliquant, dans différentes langues, comment accéder aux autres langues, afin de laisser aux participants le temps de les lire.", "«Nous commencerons la réunion dans quelques minutes. Si vous ne parlez pas anglais, voici des instructions dans différentes langues pour activer et régler la traduction et les sous-titres de Zoom.\n En bas à droite de votre écran Zoom, cliquez sur Plus, puis sur Afficher les sous-titres (CC)\nCliquez sur la petite flèche (˄) à côté de Sous-titres, activez la traduction, puis\na) choisissez la langue dans laquelle vous souhaitez LIRE\nb) choisissez la langue dans laquelle vous souhaitez PARLER\nVeuillez parler clairement et lentement pour aider les personnes qui suivent les sous-titres traduits. »", "« Si vous souhaitez changer votre nom, envoyez un message à un coanimateur qui le modifiera. »", "Afficher à l’écran la diapositive de l’affiche du WOC.", "« Bienvenue à la RÉUNION SPÉCIALE DE REMERCIEMENT — CÉLÉBRONS 40 ANS DE CoDA À TRAVERS LE MONDE ! »", "Affichez à l’écran la prière de votre choix pour ouvrir la réunion.", "« Après un moment de silence, nous lirons la prière de ________. »", "Observez un moment de silence, puis lisez la prière de ________.", "« Pourrions-nous avoir 4 volontaires pour lire les documents fondamentaux de CoDA ? Veuillez lever la main si vous souhaitez lire. *Veuillez lire lentement pour permettre la traduction.* »", "Affichez à l'écran le Préambule.", "Repérez la première personne ayant levé la main (dans la liste des participants ou à l'écran), prononcez son nom et demandez : « Pourriez-vous lire le Préambule de CoDA ? »", "Affichez à l'écran le Message de bienvenue.", "Repérez la première personne ayant levé la main (dans la liste des participants ou à l'écran), prononcez son nom et demandez : « Pourriez-vous lire le Message de bienvenue de CoDA ? »", "Affichez à l'écran les Douze Étapes.", "Repérez la première personne ayant levé la main (dans la liste des participants ou à l'écran), prononcez son nom et demandez : « Pourriez-vous lire les Douze Étapes de CoDA ? »", "Affichez à l'écran les Douze Traditions.", "Repérez la première personne ayant levé la main (dans la liste des participants ou à l'écran), prononcez son nom et demandez : « Pourriez-vous lire les Douze Traditions de CoDA ? »", "Utilisez et lisez ici toute lecture choisie de Co-Dépendants Anonymes sur les échanges croisés ou la sécurité.", "“Pour préserver l’anonymat, assurez-vous de vous trouver dans un endroit sûr et privé.”", "“Le clavardage sera désactivé pendant les partages, sauf avec l’animateur ou les coanimateurs.”", "**Ken et Mary, les fondateurs, prendront la parole lors de la première séance (AZ 5 pm/7pm EST vendredi, GMT 00:00 samedi), puis plus tard (AZ 9 am/11am EST samedi, GMT 4 pm samedi).**", "“Levez la main si vous souhaitez partager votre Expérience, votre Force et votre Espoir.”", "“Chaque partage durera au maximum ______ minutes (l’hôte ou le modérateur/lecteur du script choisit la durée du partage). Veuillez conclure lorsque vous entendez le minuteur. [*petit rappel : veuillez parler lentement afin de permettre la traduction.]”", "Si une personne bénévole est inscrite pour gérer le temps dans le tableau des horaires, demandez-lui si elle est disponible. Sinon, demandez une personne volontaire pour chronométrer.", "« Pouvons-nous avoir une personne volontaire pour gérer le temps ? »", "Afficher à l’écran l’image d’information du WOC.", "Mentionner l’atelier sur le parrainage", "« Le Comité de sensibilisation mondiale organisera un atelier sur le parrainage le samedi 30 janvier 2027. Nous communiquerons davantage de détails à la fraternité dès qu’ils seront disponibles et une affiche sera publiée sur le site coda.org. »", "Partager l’écran avec la Septième Tradition", "“Notre septième tradition nous rappelle que nous nous soutenons par nos propres contributions et que chaque groupe CoDA devrait subvenir entièrement à ses besoins et refuser les contributions extérieures. Nous vous invitons à donner selon vos moyens.”", "« Merci à toutes les personnes qui ont rendu service et contribué à rendre cette réunion possible. »", "Partager l’écran avec les Douze Promesses", "“Veuillez lever la main si vous souhaitez lire...”", "Les Douze Promesses", "Choisissez une prière pour clôturer la réunion.", "Lisez la prière choisie.", "“Continuez à revenir ! Ça marche si vous y travaillez ! Alors, travaillez-y ! Vous en valez la peine !”", "Remerciez tout le monde pour la réunion.", "À la fin de chaque période de deux heures :", "Choisissez de la musique à diffuser entre les créneaux.", "Lectures supplémentaires suggérées lorsque les partages sont terminés, s’il reste du temps.", "Choisissez la musique de votre choix à diffuser.", "Les membres de longue date peuvent disposer de 10 à 15 minutes pour partager."], "pt-PT": ["Peça a quem partilha o ecrã que vá ao diapositivo 1 (primeiro diapositivo de legendas).", "Partilhe lentamente cada diapositivo dos diferentes idiomas que explica como aceder a outros idiomas, para dar tempo aos participantes de os lerem.", "“Vamos começar a reunião dentro de alguns minutos. Se não fala inglês, aqui estão instruções em diferentes idiomas sobre como ativar e ajustar as traduções e legendas do Zoom.\nNo canto inferior direito do ecrã do Zoom, clique em Mais e depois em Mostrar legendas (CC)\nClique na pequena seta (˄) junto a Legendas, ative a Tradução e\na) escolha o idioma em que pretende LER\nb) escolha o idioma em que pretende FALAR\nPor favor, falem claramente e devagar para ajudar quem acompanha as legendas traduzidas.”", "“Se pretender alterar o seu nome, envie uma mensagem a um coanfitrião, que o alterará.”", "Partilhar no ecrã o diapositivo do cartaz do WOC.", "“Bem-vindos à REUNIÃO ESPECIAL DE AGRADECIMENTO — A CELEBRAR 40 ANOS DE CoDA EM TODO O MUNDO!”", "Partilhe no ecrã a oração escolhida para abrir a reunião.", "“Após um momento de silêncio, leremos a oração de ________.”", "Faça um momento de silêncio e depois leia a oração de ________.", "“Podemos contar com 4 voluntários para ler os documentos fundamentais de CoDA? Levante a mão se desejar ler. *Por favor, leia devagar para permitir a tradução.*”", "Partilhe no ecrã o Preâmbulo.", "Veja quem levantou a mão primeiro (na lista de participantes ou no ecrã), diga o nome dessa pessoa e pergunte: “Poderia ler o Preâmbulo de CoDA?”", "Partilhe no ecrã as Boas-vindas.", "Veja quem levantou a mão primeiro (na lista de participantes ou no ecrã), diga o nome dessa pessoa e pergunte: “Poderia ler as Boas-vindas de CoDA?”", "Partilhe no ecrã os Doze Passos.", "Veja quem levantou a mão primeiro (na lista de participantes ou no ecrã), diga o nome dessa pessoa e pergunte: “Poderia ler os Doze Passos de CoDA?”", "Partilhe no ecrã as Doze Tradições.", "Veja quem levantou a mão primeiro (na lista de participantes ou no ecrã), diga o nome dessa pessoa e pergunte: “Poderia ler as Doze Tradições de CoDA?”", "Utilize e leia aqui qualquer leitura escolhida de Codependentes Anónimos sobre conversas cruzadas ou segurança.", "“Para preservar o anonimato, certifique-se de que está num local seguro e privado.”", "“O chat estará desativado durante as partilhas, exceto para o anfitrião e os coanfitriões.”", "**Ken e Mary, os fundadores, irão falar na primeira sessão (AZ 5 pm/7pm EST sexta-feira, GMT 00:00 sábado) e depois mais tarde (AZ 9 am/11am EST sábado, GMT 4 pm sábado).**", "“Levante a mão se quiser partilhar a sua Experiência, Força e Esperança.”", "“Cada partilha terá até ______ minutos (o anfitrião ou moderador/leitor do guião escolhe o tempo de partilha). Por favor, termine quando ouvir o temporizador. [*como um lembrete gentil, por favor fale devagar para permitir que as traduções sejam feitas.]”", "Mencionar o workshop de apadrinhamento", "Se houver uma pessoa voluntária inscrita como responsável pelo tempo na tabela de horários, pergunte se está disponível. Caso contrário, peça uma pessoa voluntária para controlar o tempo.", "“Podemos contar com uma pessoa voluntária para controlar o tempo?”", "Partilhar no ecrã a imagem informativa do WOC.", "“O Comité de Divulgação Mundial realizará um workshop sobre apadrinhamento no sábado, 30 de janeiro de 2027. Partilharemos mais detalhes com a irmandade quando estiverem disponíveis, e será publicado um cartaz no sítio coda.org.”", "Partilhar o ecrã com a Sétima Tradição", "“Nossa sétima tradição nos lembra que nos sustentamos por meio de nossas próprias contribuições e que todo grupo de CoDA deve ser totalmente autossustentável, recusando contribuições externas. Pedimos que contribua conforme suas possibilidades.”", "“Obrigado a todas as pessoas que prestaram serviço e ajudaram a tornar esta reunião possível.”", "Partilhar o ecrã com as Doze Promessas", "“Por favor, levante a mão se quiser ler...”", "As Doze Promessas", "Escolha uma oração para encerrar a reunião.", "Leia a oração escolhida.", "“Continue a voltar! Funciona se trabalhar o programa! Por isso, trabalhe-o! Você merece!”", "Agradeça a todos pela reunião.", "No final de cada duas horas:", "Escolha música para passar entre os horários das sessões.", "Leituras adicionais sugeridas quando as pessoas terminarem de partilhar, se houver tempo.", "Escolha qualquer música para passar.", "Pode ser dado aos membros com muitos anos de recuperação um período de 10 a 15 minutos para partilhar."], "fa": ["از فردی که صفحه را به اشتراک می‌گذارد بخواهید به اسلاید ۱ (اولین اسلاید زیرنویس) برود.", "اسلایدهای مربوط به دسترسی به زبان‌های دیگر را برای هر زبان به‌آرامی نمایش دهید تا شرکت‌کنندگان فرصت خواندن داشته باشند.", "«جلسه تا چند دقیقهٔ دیگر آغاز می‌شود. اگر انگلیسی صحبت نمی‌کنید، در اینجا دستورالعمل‌هایی به زبان‌های مختلف برای فعال‌کردن و تنظیم ترجمه و زیرنویس‌های زوم ارائه شده است.\nدر پایینِ سمت راست صفحهٔ زوم، روی More و سپس Show Captions (CC) کلیک کنید\nروی پیکان کوچک (˄) کنار Captions کلیک کنید، Translation را روشن کنید و\nالف) زبانی را که می‌خواهید به آن بخوانید انتخاب کنید\nب) زبانی را که می‌خواهید به آن صحبت کنید انتخاب کنید\nلطفاً واضح و آهسته صحبت کنید تا افرادی که از زیرنویس ترجمه‌شده استفاده می‌کنند بتوانند دنبال کنند.»", "«اگر می‌خواهید نامتان تغییر کند، به یکی از میزبانان همکار پیام دهید تا آن را تغییر دهد.»", "اسلاید پوستر WOC را به اشتراک بگذارید.", "«به نشست ویژهٔ سپاسگزاری و جشن ۴۰ سالگی CoDA از سراسر جهان خوش آمدید!»", "دعای انتخابی خود را برای آغاز جلسه روی صفحه نمایش دهید.", "«پس از لحظه‌ای سکوت، دعای ________ را می‌خوانیم.»", "لحظه‌ای سکوت کنید، سپس دعای ________ را بخوانید.", "«آیا ۴ داوطلب برای خواندن متون بنیادی CoDA داریم؟ اگر مایل به خواندن هستید، لطفاً دست خود را بالا ببرید. *لطفاً برای امکان ترجمه آهسته بخوانید.*»", "مقدمه را روی صفحه نمایش دهید.", "نخستین فردی را که دستش را بالا برده است (در فهرست شرکت‌کنندگان یا روی صفحه) پیدا کنید، نام او را بگویید و بپرسید: «آیا ممکن است مقدمه مربوط به CoDA را بخوانید؟»", "خوشامدگویی را روی صفحه نمایش دهید.", "نخستین فردی را که دستش را بالا برده است (در فهرست شرکت‌کنندگان یا روی صفحه) پیدا کنید، نام او را بگویید و بپرسید: «آیا ممکن است خوشامدگویی مربوط به CoDA را بخوانید؟»", "دوازده قدم را روی صفحه نمایش دهید.", "نخستین فردی را که دستش را بالا برده است (در فهرست شرکت‌کنندگان یا روی صفحه) پیدا کنید، نام او را بگویید و بپرسید: «آیا ممکن است دوازده قدم مربوط به CoDA را بخوانید؟»", "دوازده سنت را روی صفحه نمایش دهید.", "نخستین فردی را که دستش را بالا برده است (در فهرست شرکت‌کنندگان یا روی صفحه) پیدا کنید، نام او را بگویید و بپرسید: «آیا ممکن است دوازده سنت مربوط به CoDA را بخوانید؟»", "در اینجا هر متن انتخابی از هم‌وابستگان گمنام دربارهٔ گفت‌وگوی متقاطع یا ایمنی را استفاده کرده و بخوانید.", "“برای حفظ گمنامی، لطفاً مطمئن شوید در مکانی امن و خصوصی هستید.”", "“گفت‌وگوی متنی هنگام مشارکت غیرفعال خواهد بود، مگر برای ارتباط با میزبان یا میزبانان همکار.”", "**کن و مری، بنیان‌گذاران، در نشست نخست (AZ 5 pm/7pm EST جمعه، GMT 00:00 شنبه) و سپس در نشست بعدی (AZ 9 am/11am EST شنبه، GMT 4 pm شنبه) سخن خواهند گفت.**", "“اگر می‌خواهید تجربه، نیرو و امید خود را به اشتراک بگذارید، دستتان را بالا ببرید.”", "“مدت هر مشارکت حداکثر ______ دقیقه است (میزبان یا گرداننده/خوانندهٔ متن، زمان مشارکت را تعیین می‌کند). لطفاً با شنیدن زمان‌سنج صحبت خود را تمام کنید. [*یادآوری دوستانه: لطفاً آهسته صحبت کنید تا ترجمه‌ها انجام شوند.]”", "اگر داوطلبی در جدول زمان‌بندی برای زمان‌سنجی ثبت‌نام کرده است، بپرسید آیا برای انجام این کار در دسترس است. در غیر این صورت، از یک داوطلب بخواهید زمان‌سنجی را بر عهده بگیرد.", "«آیا داوطلبی هست که زمان‌سنج جلسهٔ ما باشد؟»", "تصویر اطلاعاتی WOC را به اشتراک بگذارید.", "کارگاه راهنمایی و حمایت (Sponsorship Workshop) را یادآوری کنید", "«کمیتهٔ اطلاع‌رسانی جهانی در روز شنبه ۳۰ ژانویهٔ ۲۰۲۷ کارگاهی دربارهٔ راهنمایی و حمایت اعضا برگزار خواهد کرد. به‌محض مشخص شدن جزئیات بیشتر، آن‌ها را با انجمن در میان خواهیم گذاشت و اطلاعیه‌ای در وب‌سایت coda.org منتشر خواهد شد.»", "سنت هفتم را روی صفحه نمایش دهید", "“سنت هفتم به ما یادآوری می‌کند که با کمک‌های خودمان از خود حمایت می‌کنیم و هر گروه CoDA باید کاملاً خودکفا باشد و کمک‌های بیرونی را نپذیرد. از شما می‌خواهیم در حد توان خود کمک کنید.”", "«از همهٔ کسانی که خدمت کردند و به برگزاری این جلسه کمک کردند سپاسگزاریم.»", "دوازده وعده را روی صفحه نمایش دهید", "“اگر مایل به خواندن هستید، لطفاً دستتان را بالا ببرید...”", "دوازده وعده (The Twelve Promises)", "دعایی برای پایان جلسه انتخاب کنید.", "دعای انتخاب‌شده را بخوانید.", "“باز هم به جلسات بیایید! اگر روی آن کار کنید، نتیجه می‌دهد! پس تلاش کنید! شما ارزشش را دارید!”", "از همه برای حضور در جلسه تشکر کنید.", "در پایان هر دو ساعت:", "برای پخش در فاصلهٔ نوبت‌ها موسیقی انتخاب کنید.", "مطالب پیشنهادی اضافی برای زمانی که مشارکت‌ها تمام شده و وقت باقی مانده است.", "هر موسیقی دلخواهی را برای پخش انتخاب کنید.", "ممکن است به اعضای قدیمی ۱۰ تا ۱۵ دقیقه برای مشارکت اختصاص داده شود."]};

const el=document.getElementById('lang');const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');function render(){const lang=el.value;document.documentElement.lang=lang;document.getElementById('content').dir=lang==='fa'?'rtl':'ltr';document.getElementById('title').textContent=meta[lang].title;document.getElementById('subtitle').textContent=meta[lang].subtitle;document.getElementById('note').textContent=meta[lang].note;document.getElementById('footer').textContent=meta[lang].footer;document.getElementById('nav').innerHTML=labels[lang].map((t,i)=>`<a href="#s${i}">${esc(t)}</a>`).join('');document.getElementById('content').innerHTML=sectionsByLang[lang].map(([name,a,b],si)=>`<section id="s${si}">${data[lang].slice(a,b).map((t,j)=>`<div class="item ${types[lang][a+j]}">${esc(t).replaceAll("\n","<br>")}</div>`).join('')}</section>`).join('');}el.addEventListener('change',render);let size=19;document.getElementById('larger').onclick=()=>{size=Math.min(28,size+2);document.documentElement.style.setProperty('--size',size+'px')};document.getElementById('smaller').onclick=()=>{size=Math.max(14,size-2);document.documentElement.style.setProperty('--size',size+'px')};render();
